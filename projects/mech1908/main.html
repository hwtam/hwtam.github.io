<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parametric White Metal Wheel</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #ffffff; color: #333; overflow: hidden; }
        #ui-container { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; border-radius: 12px; width: 300px; 
            max-height: 85vh; overflow-y: auto; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); 
            border: 1px solid #ddd;
            z-index: 10;
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #555; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #007bff; height: 6px; }
        .val-display { float: right; color: #007bff; }
        button { 
            width: 100%; background: #007bff; color: white; border: none; 
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; 
        }
        button:hover { background: #0056b3; }
        h3 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="ui-container">
        <h3>Wheel Parameters</h3>
        
        <div class="control-group">
            <label>Rolling Speed <span class="val-display" id="speedVal">0</span></label>
            <input type="range" id="speed" min="-0.2" max="0.2" value="0" step="0.01">
        </div>

        <hr>

        <div class="control-group">
            <label>Segments <span class="val-display" id="countVal">6</span></label>
            <input type="range" id="count" min="3" max="24" value="6">
        </div>

        <div class="control-group">
            <label>Overall Radius <span class="val-display" id="radiusVal">1.5</span></label>
            <input type="range" id="radius" min="0.8" max="3.0" value="1.5" step="0.1">
        </div>

        <div class="control-group">
            <label>Hub Size <span class="val-display" id="hubSizeVal">0.5</span></label>
            <input type="range" id="hubSize" min="0.1" max="1.0" value="0.5" step="0.05">
        </div>

        <div class="control-group">
            <label>Rim Width <span class="val-display" id="widthVal">0.4</span></label>
            <input type="range" id="width" min="0.1" max="1.5" value="0.4" step="0.05">
        </div>

        <div class="control-group">
            <label>Spoke Thickness <span class="val-display" id="thickVal">0.05</span></label>
            <input type="range" id="thick" min="0.01" max="0.3" value="0.05" step="0.01">
        </div>

        <div class="control-group">
            <label>Tire Depth <span class="val-display" id="tireDepthVal">0.3</span></label>
            <input type="range" id="tireDepth" min="0.1" max="0.8" value="0.3" step="0.05">
        </div>

        <div class="control-group">
            <label>Segment Gap <span class="val-display" id="gapVal">0.8</span></label>
            <input type="range" id="gap" min="0.1" max="1.0" value="0.8" step="0.05">
        </div>

        <button id="downloadStl">Export STL</button>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';

        let scene, camera, renderer, controls, wheelGroup;
        const exporter = new STLExporter();
        
        // Extended Parameters
        const params = { 
            count: 6, 
            radius: 1.5, 
            hubSize: 0.5, 
            width: 0.4, 
            thick: 0.05, 
            tireDepth: 0.3,
            gap: 0.8,
            speed: 0 
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.LinearToneMapping;
            renderer.toneMappingExposure = 1.8;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            
            // Grid for reflection reference
            const grid = new THREE.GridHelper(20, 20, 0xdddddd, 0xeeeeee);
            grid.position.y = -2.5;
            scene.add(grid);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(10, 10, 10);
            scene.add(sun);

            // Environment
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new THREE.Scene()).texture;

            createWheel();

            // Dynamic UI Logic
            Object.keys(params).forEach(key => {
                const input = document.getElementById(key);
                if (input) {
                    input.addEventListener('input', (e) => {
                        params[key] = parseFloat(e.target.value);
                        document.getElementById(key + 'Val').innerText = params[key];
                        if (key !== 'speed') createWheel();
                    });
                }
            });

            document.getElementById('downloadStl').addEventListener('click', exportSTL);
            window.addEventListener('resize', onResize);
        }

        function createWheel() {
            if (wheelGroup) scene.remove(wheelGroup);
            wheelGroup = new THREE.Group();
            
            const metalMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness: 1.0, roughness: 0.02, 
                reflectivity: 1.0, envMapIntensity: 3.0, clearcoat: 1.0 
            });

            const rubberMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

            // 1. Hub
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(params.hubSize, params.hubSize, params.width, 32), metalMat);
            hub.rotation.x = Math.PI / 2;
            wheelGroup.add(hub);

            // 2. Dynamic Spokes and Pads
            for (let i = 0; i < params.count; i++) {
                const angle = (i / params.count) * Math.PI * 2;
                
                // Spoke
                const spokeLen = params.radius - (params.tireDepth / 2);
                const spoke = new THREE.Mesh(new THREE.BoxGeometry(params.thick, spokeLen, params.width * 0.8), metalMat);
                // Position spoke between hub and outer rim
                const spokePos = spokeLen / 2;
                spoke.position.set(Math.cos(angle) * spokePos, Math.sin(angle) * spokePos, 0);
                spoke.rotation.z = angle + Math.PI / 2;
                wheelGroup.add(spoke);

                // Tire Pad
                const arcShape = new THREE.Shape();
                const arcAngle = (Math.PI * 2 / params.count) * params.gap;
                const rIn = params.radius - params.tireDepth;
                const rOut = params.radius;
                
                arcShape.absarc(0, 0, rOut, angle - arcAngle / 2, angle + arcAngle / 2, false);
                arcShape.absarc(0, 0, rIn, angle + arcAngle / 2, angle - arcAngle / 2, true);
                
                const padGeom = new THREE.ExtrudeGeometry(arcShape, { depth: params.width, bevelEnabled: true, bevelSize: 0.02 });
                const pad = new THREE.Mesh(padGeom, rubberMat);
                pad.position.z = -params.width / 2;
                wheelGroup.add(pad);
            }
            
            scene.add(wheelGroup);
        }

        function exportSTL() {
            const result = exporter.parse(wheelGroup, { binary: true });
            const blob = new Blob([result], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'custom_wheel.stl';
            link.click();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (wheelGroup) wheelGroup.rotation.z -= params.speed;
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
